version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gasme_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gasme_jobs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./server/seed-data.sql:/docker-entrypoint-initdb.d/2-seed.sql
      - ./server/db.sql:/docker-entrypoint-initdb.d/3-simple-seed.sql

  backend:
    build: ./server
    container_name: gasme_backend
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=gasme_jobs_db
      - DB_PORT=5432
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build: .
    container_name: gasme_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
